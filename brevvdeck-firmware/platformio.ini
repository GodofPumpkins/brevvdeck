; BrevvDeck Firmware — PlatformIO Project Configuration
; Target board : PJRC Teensy 4.1
; Framework    : Arduino (via Teensyduino)
; USB composite: Serial + MIDI + Audio
;
; SETUP (one-time):
;   1. Install VS Code extension "PlatformIO IDE"
;   2. Open this folder in VS Code — PlatformIO auto-detects platformio.ini
;   3. PlatformIO downloads the Teensy toolchain + libraries automatically
;
; UPLOAD:
;   Press the Upload button (→) in the PlatformIO toolbar, or run:
;     pio run --target upload
;   The Teensy Loader app launches automatically; press the button on the
;   Teensy 4.1 board once to enter bootloader mode if it does not flash
;   within 5 seconds.
;
; SERIAL MONITOR:
;   Click the plug icon in the PlatformIO status bar, or run:
;     pio device monitor
;   Only produces output when built with -D BREVVDECK_DEBUG (see below).

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; All source files (.cpp / .h) live directly in this folder, not in src/.
src_dir = .

; ---------------------------------------------------------------------------
; USB Composite Mode
; ---------------------------------------------------------------------------
; USB_MIDI_AUDIO_SERIAL exposes three USB interfaces simultaneously:
;   - MIDI    — usbMIDI API (sending notes/CC, receiving CC from host)
;   - Audio   — USB audio class (PCM5102A DACs appear as sound card)
;   - Serial  — Serial.print() debug output on a virtual COM port
;
; This flag is read by Teensyduino's USB stack at compile time.
; If you change this you must also change Tools → USB Type in Arduino IDE.
build_flags =
    -D USB_MIDI_AUDIO_SERIAL

; ---------------------------------------------------------------------------
; Debug Build
; ---------------------------------------------------------------------------
; Uncomment the section below (and comment out the one above) to enable
; Serial.printf() debug logging via the LOG() macro in main.cpp.
; The extra output adds ~2 KB to flash and stalls the USB serial on first
; boot until a terminal connects — do not use in production.
;
; build_flags =
;     -D USB_MIDI_AUDIO_SERIAL
;     -D BREVVDECK_DEBUG

; ---------------------------------------------------------------------------
; Libraries
; ---------------------------------------------------------------------------
; Wire, SPI, and usbMIDI are bundled with Teensyduino — no entry needed.
; Only third-party libraries are listed here.

lib_deps =
    paulstoffregen/Encoder @ ^1.4.4   ; PJRC interrupt-driven quadrature encoder

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------
; teensy-cli uses the command-line Teensy Loader which ships with
; Teensyduino. It detects the board automatically over USB HID.

upload_protocol = teensy-cli

; ---------------------------------------------------------------------------
; Serial Monitor
; ---------------------------------------------------------------------------
monitor_speed = 115200
